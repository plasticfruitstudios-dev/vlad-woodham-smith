  <script>
    const l = document.getElementById('loader');
    if (sessionStorage.getItem('vws-visited')) {
      l.style.display = 'none';
      setTimeout(() => window.revealTagline && window.revealTagline(), 300);
    } else {
      sessionStorage.setItem('vws-visited', '1');
      const pctEl = document.getElementById('load-pct');
      const imgs = Array.from(document.images).filter(im => !l.contains(im));
      let loadedCount = 0;
      imgs.forEach(im => {
        if (im.complete) loadedCount++;
        else {
          im.addEventListener('load', () => loadedCount++);
          im.addEventListener('error', () => loadedCount++);
        }
      });
      const start = performance.now();
      const MIN = 1000, MAX = 2800;
      let shown = 0;
      function tick(now) {
        const t = now - start;
        const real = imgs.length ? loadedCount / imgs.length : 1;
        const floor = Math.min(t / MAX, 1);
        const ceil = Math.min(t / MIN, 1);
        const target = Math.min(Math.max(real, floor), ceil) * 100;
        shown = Math.min(shown + 3, Math.max(shown, target));
        pctEl.textContent = Math.floor(shown) + '%';
        if (shown >= 100) {
          l.classList.add('hide');
          window.revealTagline && window.revealTagline();
          setTimeout(() => l.style.display = 'none', 700);
        } else {
          requestAnimationFrame(tick);
        }
      }
      requestAnimationFrame(tick);
    }
  </script>

  <script>
    (function () {
      const el = document.getElementById('strip');
      if (!el) return;

      // vertical wheel -> horizontal scroll
      el.addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          e.preventDefault();
          el.scrollLeft += e.deltaY;
        }
      }, { passive: false });

      // click-drag to pan
      let down = false, startX = 0, startLeft = 0, dragged = false;
      el.addEventListener('mousedown', (e) => {
        down = true; dragged = false;
        startX = e.pageX; startLeft = el.scrollLeft;
      });
      window.addEventListener('mousemove', (e) => {
        if (!down) return;
        const dx = e.pageX - startX;
        if (Math.abs(dx) > 6) dragged = true;
        if (dragged) { e.preventDefault(); el.scrollLeft = startLeft - dx; }
      });
      window.addEventListener('mouseup', () => { down = false; });

      document.addEventListener('keydown', (e) => {
        if (document.getElementById('lightbox').classList.contains('open')) return;
        if (e.key === 'ArrowRight') el.scrollBy({ left: 420, behavior: 'smooth' });
        if (e.key === 'ArrowLeft') el.scrollBy({ left: -420, behavior: 'smooth' });
      });

      // lightbox (suppressed after a drag)
      const items = Array.from(document.querySelectorAll('.strip-img img'));
      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lb-img');
      let cur = 0;
      const show = i => { cur = (i + items.length) % items.length; lbImg.src = items[cur].src; };
      items.forEach((im, i) => im.addEventListener('click', () => {
        if (dragged) return;
        show(i); lb.classList.add('open');
      }));
      const close = () => { lb.classList.remove('open'); lbImg.src = ''; };
      document.getElementById('lb-close').addEventListener('click', close);
      document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); show(cur - 1); });
      document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); show(cur + 1); });
      lb.addEventListener('click', e => { if (e.target === lb) close(); });
      document.addEventListener('keydown', e => {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') show(cur - 1);
        if (e.key === 'ArrowRight') show(cur + 1);
      });
    })();
  </script>
